[pytest]
testpaths = tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
log_file = test_run.log
log_file_level = DEBUG
markers =
    smoke: fast checks that the core API paths work
    negative: tests that send bad input or bad credentials
    ai: tests for the AI-style chat API (local mock)
addopts = --strict-markers